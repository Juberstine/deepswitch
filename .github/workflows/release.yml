name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset_name: codex-deepseek-switcher-linux-x86_64
            binary_suffix: ""
            rustflags: "-C target-feature=+crt-static"
            deployment_target: ""
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_name: codex-deepseek-switcher-linux-aarch64
            binary_suffix: ""
            rustflags: "-C target-feature=+crt-static"
            deployment_target: ""
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_name: codex-deepseek-switcher-macos-x86_64
            binary_suffix: ""
            rustflags: ""
            deployment_target: "10.15"
          - runner: macos-15
            target: aarch64-apple-darwin
            asset_name: codex-deepseek-switcher-macos-aarch64
            binary_suffix: ""
            rustflags: ""
            deployment_target: "11.0"
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset_name: codex-deepseek-switcher-windows-x86_64
            binary_suffix: ".exe"
            rustflags: "-C target-feature=+crt-static"
            deployment_target: ""
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_name: codex-deepseek-switcher-windows-aarch64
            binary_suffix: ".exe"
            rustflags: "-C target-feature=+crt-static"
            deployment_target: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools file
      - name: Build optimized binary
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Smoke-test binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/codex-deepseek-switcher${{ matrix.binary_suffix }}"
          "$binary" --version
      - name: Verify static Linux linkage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/codex-deepseek-switcher"
          description="$(file "$binary")"
          case "$description" in
            *"statically linked"* | *"static-pie linked"*) ;;
            *)
              echo "expected a static binary, got: $description" >&2
              exit 1
              ;;
          esac
      - name: Package release archive
        shell: bash
        run: >-
          sh scripts/package-release.sh
          "${{ matrix.target }}"
          "${{ matrix.asset_name }}"
          "${{ matrix.binary_suffix }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Attest release archive
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ matrix.asset_name }}.tar.gz

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate release tag
        id: version
        shell: bash
        run: |
          package_version="$(
            cargo metadata --no-deps --format-version 1 |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])'
          )"
          release_tag="v$package_version"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$release_tag already exists; every merge must use a new Cargo version" >&2
            exit 1
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Generate checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS
      - name: Attest checksum manifest
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@v4
        with:
          subject-path: dist/SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ steps.version.outputs.tag }}"
          --target "$GITHUB_SHA"
          --title "${{ steps.version.outputs.tag }}"
          --generate-notes
          dist/*.tar.gz
          dist/SHA256SUMS
