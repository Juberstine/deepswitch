name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commit-attribution:
    name: Commit attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject agent-attributed commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check-commit-attribution.py "$BASE_SHA" "$HEAD_SHA"

  release-version:
    name: Release version
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Require an unreleased Cargo version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])'
          )"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released; update Cargo.toml and Cargo.lock" >&2
            exit 1
          fi
          echo "v$version is available for release."

  docker-tests:
    name: Docker checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build development image
        run: docker build --file Dockerfile.dev --tag codex-deepseek-switcher-dev .
      - name: Format, lint, and test
        run: docker run --rm codex-deepseek-switcher-dev

  homebrew-formula:
    name: Homebrew formula
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render and lint formula
        shell: bash
        run: |
          mkdir -p dist
          for asset in \
            codex-deepseek-switcher-linux-aarch64.tar.gz \
            codex-deepseek-switcher-linux-x86_64.tar.gz \
            codex-deepseek-switcher-macos-aarch64.tar.gz \
            codex-deepseek-switcher-macos-x86_64.tar.gz
          do
            printf '%064d  ./%s\n' 0 "$asset"
          done > dist/SHA256SUMS
          python3 scripts/render-homebrew-formula.py \
            --version 0.0.0 \
            --checksums dist/SHA256SUMS \
            --output dist/codex-deepseek-switcher.rb
          ruby -c dist/codex-deepseek-switcher.rb
          brew style dist/codex-deepseek-switcher.rb

  native-build:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Check native credential-store backend
        run: cargo check --locked --all-targets
