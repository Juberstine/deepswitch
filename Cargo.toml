[package]
name = "deepswitch"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Safely switch Codex between OpenAI and DeepSeek"
license = "MIT"
repository = "https://github.com/Juberstine/deepswitch"
homepage = "https://github.com/Juberstine/deepswitch"
readme = "README.md"
keywords = ["codex", "deepseek", "cli", "keyring"]
categories = ["command-line-utilities", "config"]

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
directories = "6.0.0"
keyring = "4.1.6"
rpassword = "7.5.4"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.19"
toml_edit = "0.25.13"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
