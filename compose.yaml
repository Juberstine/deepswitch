services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    environment:
      CARGO_HOME: /cargo
      CARGO_TARGET_DIR: /workspace/target
    volumes:
      - .:/workspace
      - cargo-registry:/cargo/registry
      - cargo-git:/cargo/git
      - cargo-target:/workspace/target
    command: ["sh", "scripts/dev-check.sh"]

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
